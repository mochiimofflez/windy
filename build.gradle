plugins { id 'net.neoforged.moddev' version '2.0.42-beta' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    mavenCentral()
}
neoForge {
    version = project.neoforge_version
    runs {
        client {
            client()
            if (project.hasProperty("windyQuickPlay")) {
                programArguments.addAll("--quickPlaySingleplayer", project.property("windyQuickPlay"))
            }
        }
    }
    mods { "windy" { sourceSet sourceSets.main } }
}
// Settings live in the NeoForge mods config screen, so Sodium's config API is no longer a dependency.
// Sodium is still pulled in at dev runtime only, to sanity-check rendering against it.
dependencies {
    // Compile against the public, unobfuscated client wind API. Kept compile-only so Windy still
    // loads and behaves normally in packs that do not have Aeronautics installed.
    compileOnly "maven.modrinth:aeronautics-winds-and-weather:1.3.1"

    additionalRuntimeClasspath "maven.modrinth:sodium:${project.sodium_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}
def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach { it.options.encoding = "UTF-8"; it.options.release = targetJavaVersion }
java { def v = JavaVersion.toVersion(targetJavaVersion); if (JavaVersion.current() < v) { toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion) } }
processResources {
    def props = ["version": project.version]
    inputs.properties(props)
    filesMatching("META-INF/neoforge.mods.toml") { expand props }
}
jar { from("LICENSE") { rename { "${it}_${project.archives_base_name}" } } }
